name: Publish .deb to shared apt repo

# Fired by a member project's own release workflow via:
#   gh api repos/YadeWira/pack-apt/dispatches \
#     -f event_type=deb-release \
#     -f client_payload[repo]=YadeWira/<project> \
#     -f client_payload[tag]=<release-tag>
#
# The triggering repo needs a PAT (secret PACK_APT_TOKEN, scope: repo) with
# permission to dispatch on this repo — GITHUB_TOKEN is repo-local and can't
# trigger workflows in a different repository.
#
# GPG signing key lives ONLY here (GPG_PRIVATE_KEY / GPG_KEY_ID secrets),
# not duplicated into each member project's own secrets.

on:
  repository_dispatch:
    types: [deb-release]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Download .deb from the triggering project's release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${{ github.event.client_payload.repo }}"
          TAG="${{ github.event.client_payload.tag }}"
          if [ -z "$REPO" ] || [ -z "$TAG" ]; then
            echo "Missing client_payload.repo or client_payload.tag" >&2
            exit 1
          fi
          echo "Fetching .deb from $REPO @ $TAG"
          gh release download "$TAG" --repo "$REPO" --pattern "*.deb" --dir /tmp/debs

      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | \
            gpg --batch --yes --no-tty --pinentry-mode loopback --passphrase "" --import
          echo "${{ secrets.GPG_KEY_ID }}:6:" | gpg --import-ownertrust

      - name: Update apt repository
        run: |
          sudo apt-get install -y apt-utils

          mkdir -p pool/main dists/stable/main/binary-amd64
          cp /tmp/debs/*.deb pool/main/

          dpkg-scanpackages --multiversion pool/ \
            > dists/stable/main/binary-amd64/Packages
          gzip -k -f dists/stable/main/binary-amd64/Packages

          printf '%s\n' \
            'Origin: Pack Family' \
            'Label: Pack Family APT Repository' \
            'Suite: stable' \
            'Codename: stable' \
            'Architectures: amd64' \
            'Components: main' \
            'Description: Shared apt repository for packJPG, packMP3, packMP2, packPNG' \
            > dists/stable/Release
          apt-ftparchive release dists/stable >> dists/stable/Release

          gpg --default-key "${{ secrets.GPG_KEY_ID }}" \
              --batch --yes --no-tty --pinentry-mode loopback --passphrase "" \
              --clearsign -o dists/stable/InRelease dists/stable/Release
          gpg --default-key "${{ secrets.GPG_KEY_ID }}" \
              --batch --yes --no-tty --pinentry-mode loopback --passphrase "" \
              -abs -o dists/stable/Release.gpg dists/stable/Release

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "apt: publish ${{ github.event.client_payload.repo }} ${{ github.event.client_payload.tag }}"
          git push
